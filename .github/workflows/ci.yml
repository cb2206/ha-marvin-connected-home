name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repo; keep the token read-only.
permissions:
  contents: read

# Third-party actions are pinned to commit SHAs so a compromised or moved tag
# upstream cannot inject code into this workflow. The comment records the ref
# each SHA was resolved from; bump deliberately. hassfest and the HACS action
# only publish moving branches, so their pins go stale by design — refresh them
# when validation rules need updating.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      # Pinned so a new ruff release cannot fail main with no code change.
      - run: pip install "pytest==9.1.1" "ruff==0.16.1"
      - run: ruff check custom_components tests tests_ha scripts
      - run: python -m pytest tests/ -q

  # The stub-based suite above cannot tell whether the component still fits
  # Home Assistant; this one runs the real flows and platforms inside it. It
  # installs the library at the version the manifest pins, so it also proves
  # that version is actually published.
  test-homeassistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: pip install pytest-homeassistant-custom-component
      - run: pip install $(python -c "import json; print(*json.load(open('custom_components/marvin_connected_home/manifest.json'))['requirements'])")
      - run: python -m pytest tests_ha/ -q

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: home-assistant/actions/hassfest@ab22029681aa532bfe7de5774a9972d67bfbd2c0 # master 2026-07

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main 2026-07
        with:
          category: integration
          # Brand images ship in custom_components/marvin_connected_home/brand/,
          # which HA 2026.3+ serves directly. The home-assistant/brands registry
          # no longer accepts new custom components, so this check cannot pass.
          ignore: brands
